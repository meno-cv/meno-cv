<svg width="1200" height="100"
     viewBox="0 0 1200 100"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="footerBg"
                    x1="0" y1="0"
                    x2="1" y2="0">

      <stop offset="0%" stop-color="#020605"/>
      <stop offset="50%" stop-color="#07100C"/>
      <stop offset="100%" stop-color="#020605"/>

    </linearGradient>

    <filter id="dotGlow">
      <feGaussianBlur stdDeviation="2"/>
    </filter>

  </defs>


  <!-- Background -->

  <rect
    width="1200"
    height="100"
    fill="url(#footerBg)"
  />


  <!-- Soft glowing dots -->

  <g fill="#4ADE80" filter="url(#dotGlow)" opacity="0.35">

    <circle cx="110" cy="35" r="3"/>
    <circle cx="260" cy="68" r="2.5"/>
    <circle cx="390" cy="25" r="2.5"/>
    <circle cx="520" cy="58" r="3"/>
    <circle cx="650" cy="30" r="2.5"/>
    <circle cx="790" cy="67" r="2.5"/>
    <circle cx="920" cy="35" r="3"/>
    <circle cx="1050" cy="62" r="2.5"/>
    <circle cx="1130" cy="28" r="3"/>

  </g>


  <!-- Main particles -->

  <g fill="#4ADE80">

    <circle cx="110" cy="35" r="1.5" opacity="0.65"/>
    <circle cx="260" cy="68" r="1.2" opacity="0.5"/>
    <circle cx="390" cy="25" r="1.3" opacity="0.6"/>
    <circle cx="520" cy="58" r="1.5" opacity="0.5"/>
    <circle cx="650" cy="30" r="1.2" opacity="0.65"/>
    <circle cx="790" cy="67" r="1.2" opacity="0.5"/>
    <circle cx="920" cy="35" r="1.5" opacity="0.6"/>
    <circle cx="1050" cy="62" r="1.2" opacity="0.5"/>
    <circle cx="1130" cy="28" r="1.5" opacity="0.6"/>

  </g>


  <!-- Subtle connecting lines -->

  <g
    stroke="#4ADE80"
    stroke-width="1"
    opacity="0.10">

    <line x1="110" y1="35" x2="390" y2="25"/>
    <line x1="390" y1="25" x2="650" y2="30"/>
    <line x1="650" y1="30" x2="920" y2="35"/>
    <line x1="920" y1="35" x2="1130" y2="28"/>

  </g>


  <!-- Final line -->

  <line
    x1="40"
    y1="88"
    x2="1160"
    y2="88"
    stroke="#4ADE80"
    stroke-width="1"
    opacity="0.55"
  />

</svg>

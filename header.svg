<svg width="1200" height="320" viewBox="0 0 1200 320"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- ================= BACKGROUND ================= -->

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020605"/>
      <stop offset="55%" stop-color="#07100C"/>
      <stop offset="100%" stop-color="#03110B"/>
    </linearGradient>


    <!-- ================= GREEN GLOW ================= -->

    <radialGradient id="greenGlow">
      <stop offset="0%" stop-color="#22FF88" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#22FF88" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#22FF88" stop-opacity="0"/>
    </radialGradient>


    <filter id="blur">
      <feGaussianBlur stdDeviation="28"/>
    </filter>


    <filter id="particleGlow">
      <feGaussianBlur stdDeviation="3"/>
    </filter>


    <!-- ================= GRID ================= -->

    <pattern id="grid"
             width="45"
             height="45"
             patternUnits="userSpaceOnUse">

      <path
        d="M45 0H0V45"
        fill="none"
        stroke="#4ADE80"
        stroke-width="1"
        opacity="0.035"
      />

    </pattern>


    <!-- ================= CODE SCREEN ================= -->

    <linearGradient id="screenFade"
                    x1="0" y1="0"
                    x2="1" y2="0">

      <stop offset="0%"
            stop-color="#020605"
            stop-opacity="0"/>

      <stop offset="35%"
            stop-color="#020605"
            stop-opacity="0.15"/>

      <stop offset="100%"
            stop-color="#020605"
            stop-opacity="0.85"/>

    </linearGradient>

  </defs>


  <!-- BACKGROUND -->
 

  <rect
    width="1200"
    height="320"
    fill="url(#bg)"
  />

  <rect
    width="1200"
    height="320"
    fill="url(#grid)"
  />


  <!-- Green atmospheric glow -->

  <ellipse
    cx="900"
    cy="150"
    rx="340"
    ry="230"
    fill="url(#greenGlow)"
    filter="url(#blur)"
  />




  <g opacity="0.18">

    <!-- editor frame -->

    <rect
      x="650"
      y="35"
      width="500"
      height="250"
      rx="10"
      fill="#020504"
      stroke="#4ADE80"
      stroke-opacity="0.18"
    />


    <!-- editor header -->

    <rect
      x="650"
      y="35"
      width="500"
      height="27"
      rx="10"
      fill="#0B1511"
    />

    <rect
      x="650"
      y="50"
      width="500"
      height="12"
      fill="#0B1511"
    />


    <!-- editor buttons -->

    <circle cx="670" cy="49" r="3"
            fill="#4ADE80"/>

    <circle cx="682" cy="49" r="3"
            fill="#64748B"/>

    <circle cx="694" cy="49" r="3"
            fill="#64748B"/>


    <!-- fake tabs -->

    <text
      x="735"
      y="53"
      font-family="monospace"
      font-size="8"
      fill="#A7F3D0">

      Main.java

    </text>


    <!-- line numbers -->

    <g
      font-family="monospace"
      font-size="8"
      fill="#64748B">

      <text x="665" y="83">01</text>
      <text x="665" y="98">02</text>
      <text x="665" y="113">03</text>
      <text x="665" y="128">04</text>
      <text x="665" y="143">05</text>
      <text x="665" y="158">06</text>
      <text x="665" y="173">07</text>
      <text x="665" y="188">08</text>
      <text x="665" y="203">09</text>
      <text x="665" y="218">10</text>
      <text x="665" y="233">11</text>
      <text x="665" y="248">12</text>

    </g>


    <!-- code -->

    <g
      font-family="monospace"
      font-size="9"
      fill="#6EE7B7">

      <text x="695" y="83">
        public class Developer {
      </text>

      <text x="710" y="98">
        String name = "Menoly";
      </text>

      <text x="710" y="113">
        String[] skills = {
      </text>

      <text x="725" y="128">
        "Java", "Web", "SQL"
      </text>

      <text x="710" y="143">
        };
      </text>

      <text x="710" y="158">
        build();
      </text>

      <text x="710" y="173">
        learn();
      </text>

      <text x="710" y="188">
        create();
      </text>

      <text x="695" y="203">
        }
      </text>

      <text x="695" y="233">
        // keep building...
      </text>

    </g>

  </g>



  <!-- SLOW CODE SCROLL -->


  <g
    font-family="monospace"
    font-size="9"
    fill="#4ADE80"
    opacity="0.07">

    <text x="850" y="310">
      01001101 01100101 01101110 01101111 01101100 01111001
    </text>

    <text x="700" y="20">
      10110100 00101101 11001010 01100101 01010101
    </text>

    <text x="1030" y="300">
      01100011 01101111 01100100 01100101
    </text>

  </g>


  <!-- ================================================= -->
  <!-- MAIN TEXT -->
  <!-- ================================================= -->

  <text
    x="100"
    y="100"
    font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"
    font-size="12"
    font-weight="500"
    letter-spacing="4"
    fill="#4ADE80">

    SOFTWARE ENGINEERING STUDENT

  </text>


  <text
    x="96"
    y="158"
    font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"
    font-size="58"
    font-weight="700"
    letter-spacing="-1"
    fill="#F8FAFC">

    MENOLY

  </text>


  <text
    x="100"
    y="190"
    font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"
    font-size="15"
    fill="#A7F3D0"
    opacity="0.75">

    Building ideas into code.

  </text>


  <line
    x1="100"
    y1="210"
    x2="245"
    y2="210"
    stroke="#4ADE80"
    stroke-width="2"
  />


  <!-- FLOATING PARTICLES -->
 
  <g fill="#4ADE80">

    <circle cx="300" cy="55" r="2">
      <animate
        attributeName="cy"
        values="55;45;55"
        dur="4s"
        repeatCount="indefinite"/>
      <animate
        attributeName="opacity"
        values="0.15;0.8;0.15"
        dur="4s"
        repeatCount="indefinite"/>
    </circle>


    <circle cx="390" cy="250" r="2">
      <animate
        attributeName="cy"
        values="250;235;250"
        dur="5s"
        repeatCount="indefinite"/>
      <animate
        attributeName="opacity"
        values="0.1;0.65;0.1"
        dur="5s"
        repeatCount="indefinite"/>
    </circle>


    <circle cx="520" cy="90" r="1.5">
      <animate
        attributeName="cy"
        values="90;75;90"
        dur="3.5s"
        repeatCount="indefinite"/>
      <animate
        attributeName="opacity"
        values="0.1;0.7;0.1"
        dur="3.5s"
        repeatCount="indefinite"/>
    </circle>


    <circle cx="580" cy="225" r="2">
      <animate
        attributeName="cy"
        values="225;205;225"
        dur="4.5s"
        repeatCount="indefinite"/>
      <animate
        attributeName="opacity"
        values="0.1;0.6;0.1"
        dur="4.5s"
        repeatCount="indefinite"/>
    </circle>


    <circle cx="1120" cy="90" r="2">
      <animate
        attributeName="cy"
        values="90;72;90"
        dur="5s"
        repeatCount="indefinite"/>
      <animate
        attributeName="opacity"
        values="0.1;0.7;0.1"
        dur="5s"
        repeatCount="indefinite"/>
    </circle>

  </g>


  <!-- FLOATING BINARY -->


  <g
    font-family="monospace"
    font-size="10"
    fill="#4ADE80">

    <text x="330" y="70" opacity="0.12">
      010101
      <animate
        attributeName="y"
        values="70;55;70"
        dur="6s"
        repeatCount="indefinite"/>
      <animate
        attributeName="opacity"
        values="0.05;0.25;0.05"
        dur="6s"
        repeatCount="indefinite"/>
    </text>


    <text x="470" y="270" opacity="0.10">
      1011001
      <animate
        attributeName="y"
        values="270;250;270"
        dur="7s"
        repeatCount="indefinite"/>
    </text>


    <text x="560" y="60" opacity="0.10">
      110010
      <animate
        attributeName="y"
        values="60;48;60"
        dur="5s"
        repeatCount="indefinite"/>
    </text>

  </g>

  <!-- CONNECTING LINES -->
 

  <g
    stroke="#4ADE80"
    stroke-width="1"
    opacity="0.12">

    <line x1="300" y1="55" x2="390" y2="250"/>

    <line x1="520" y1="90" x2="580" y2="225"/>

    <line x1="390" y1="250" x2="580" y2="225"/>

  </g>


  <!-- ================================================= -->
  <!-- BOTTOM LABEL -->
  <!-- ================================================= -->

  <text
    x="100"
    y="260"
    font-family="monospace"
    font-size="10"
    letter-spacing="2"
    fill="#6EE7B7"
    opacity="0.5">

    JAVA  ·  OOP  ·  SQL  ·  HTML  ·  CSS  ·  JAVASCRIPT

  </text>

  <!-- FRAME -->

  <rect
    x="20"
    y="20"
    width="1160"
    height="280"
    rx="12"
    fill="none"
    stroke="#FFFFFF"
    stroke-opacity="0.07"
  />


  <!-- Animated bottom light -->

  <circle
    cy="299"
    r="1.5"
    fill="#4ADE80"
    filter="url(#particleGlow)">

    <animate
      attributeName="cx"
      values="40;1160;40"
      dur="10s"
      repeatCount="indefinite"/>

  </circle>

     <path
    d="M0 278
       C150 310 300 315 450 292
       C610 268 760 268 900 295
       C1030 320 1120 310 1200 278
       L1200 320
       L0 320 Z"
    fill="#0B1120"
  />


  <!-- Green wave edge -->

  <path
    d="M0 278
       C150 310 300 315 450 292
       C610 268 760 268 900 295
       C1030 320 1120 310 1200 278"
    fill="none"
    stroke="#16A34A"
    stroke-width="2"
    opacity="0.85"
  />


  <!-- Soft green glow -->

  <path
    d="M0 278
       C150 310 300 315 450 292
       C610 268 760 268 900 295
       C1030 320 1120 310 1200 278"
    fill="none"
    stroke="#16A34A"
    stroke-width="7"
    opacity="0.10"
    filter="url(#blur)"
  />


  <!-- Animated light following the wave -->

  <p align="center">
  <svg width="1200" height="100" viewBox="0 0 1200 100"
       xmlns="http://www.w3.org/2000/svg">

    <defs>
      <linearGradient id="footerBg" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#020605"/>
        <stop offset="50%" stop-color="#07100C"/>
        <stop offset="100%" stop-color="#020605"/>
      </linearGradient>
    </defs>

    <!-- Background -->

    <rect width="1200" height="100" fill="url(#footerBg)"/>


    <!-- Dim floating dots -->

    <g fill="#4ADE80">

      <circle cx="120" cy="35" r="1.5" opacity="0.15">
        <animate
          attributeName="cy"
          values="35;25;35"
          dur="5s"
          repeatCount="indefinite"/>
        <animate
          attributeName="opacity"
          values="0.05;0.3;0.05"
          dur="5s"
          repeatCount="indefinite"/>
      </circle>

      <circle cx="280" cy="65" r="1" opacity="0.12">
        <animate
          attributeName="cy"
          values="65;52;65"
          dur="6s"
          repeatCount="indefinite"/>
        <animate
          attributeName="opacity"
          values="0.05;0.25;0.05"
          dur="6s"
          repeatCount="indefinite"/>
      </circle>

      <circle cx="430" cy="30" r="1.5" opacity="0.1">
        <animate
          attributeName="cy"
          values="30;18;30"
          dur="4s"
          repeatCount="indefinite"/>
      </circle>

      <circle cx="610" cy="58" r="1" opacity="0.15">
        <animate
          attributeName="cy"
          values="58;45;58"
          dur="5.5s"
          repeatCount="indefinite"/>
      </circle>

      <circle cx="790" cy="28" r="1.5" opacity="0.12">
        <animate
          attributeName="cy"
          values="28;17;28"
          dur="4.5s"
          repeatCount="indefinite"/>
      </circle>

      <circle cx="960" cy="65" r="1" opacity="0.15">
        <animate
          attributeName="cy"
          values="65;50;65"
          dur="6s"
          repeatCount="indefinite"/>
      </circle>

      <circle cx="1090" cy="35" r="1.5" opacity="0.1">
        <animate
          attributeName="cy"
          values="35;22;35"
          dur="5s"
          repeatCount="indefinite"/>
      </circle>

    </g>


    <!-- Subtle connecting line -->

    <line
      x1="300"
      y1="50"
      x2="610"
      y2="58"
      stroke="#4ADE80"
      stroke-width="1"
      opacity="0.06"/>

    <line
      x1="610"
      y1="58"
      x2="960"
      y2="65"
      stroke="#4ADE80"
      stroke-width="1"
      opacity="0.06"/>


    <!-- Final line -->

    <line
      x1="40"
      y1="88"
      x2="1160"
      y2="88"
      stroke="#4ADE80"
      stroke-width="1"
      opacity="0.35"/>

  </svg>
</p>

</svg>
